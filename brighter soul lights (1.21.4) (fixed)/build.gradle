plugins {
    id 'fabric-loom' version '1.3.7'
}

group = 'com.example'
version = '1.0.0'
archivesBaseName = 'brighter-soul-lights'

repositories {
    mavenCentral()
    maven { url "https://maven.fabricmc.net/" }  // critical for Fabric API
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.4"
    mappings  "net.fabricmc:yarn:1.21.4+build.2:v2"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.119.2+1.21.4"
    // <-- NO fabric-loader dependency here!
}

loom {
    runs {
        client { runDir = "run" }
        server { runDir = "run_server" }
    }
}

jar {
    from('LICENSE') { into 'META-INF' }
}
